name: YAS Microservices Matrix CI

on:
  push:
    branches: [ "main" ] # Hoặc branch bạn đang làm
  workflow_dispatch: 

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 13 service 
        service: [tax, search, rating, promotion, payment-paypal, payment, order, media, location, inventory, customer, cart, product]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment (Java & Cache)
        uses: ./.github/workflows/actions

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Short Commit ID
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Build file .jar (Quan trọng để Docker có file copy vào image)
      - name: Build with Maven
        run: mvn clean install -pl ${{ matrix.service }} -am -DskipTests

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-${{ matrix.service }}:latest