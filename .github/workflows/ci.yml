name: YAS Microservices CI

on:
  push:
    branches:
      - '**' # Chạy trên mọi branch theo yêu cầu đồ án
    paths:
      - '**/src/**'
      - '**/Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Nếu 1 service lỗi, các service khác vẫn tiếp tục build
      matrix:
        # Danh sách 13 service khớp với 13 repo bạn đã tạo
        service: [tax, search, rating, promotion, payment-paypal, payment, order, media, location, inventory, customer, cart, product]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Short Commit ID
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          # Cấu trúc của dự án YAS thường để Dockerfile ngay trong thư mục service
          context: ./${{ matrix.service }} 
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-${{ matrix.service }}:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/yas-${{ matrix.service }}:latest
