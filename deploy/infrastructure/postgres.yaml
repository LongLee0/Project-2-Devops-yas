apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    CREATE DATABASE yas_product;
    CREATE DATABASE yas_customer;
    CREATE DATABASE yas_cart;
    CREATE DATABASE yas_inventory;
    CREATE DATABASE yas_order;
    CREATE DATABASE yas_media;
    CREATE DATABASE yas_location;
    CREATE DATABASE yas_payment;
    CREATE DATABASE yas_payment_paypal;
    CREATE DATABASE yas_promotion;
    CREATE DATABASE yas_rating;
    CREATE DATABASE yas_search;
    CREATE DATABASE yas_tax;
    CREATE DATABASE keycloak_db;
---
# BƯỚC 1: TẠO PVC ĐỂ GIỮ DỮ LIỆU BỀN VỮNG
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Tận dụng bộ lưu trữ mặc định của K3s
  resources:
    requests:
      storage: 2Gi # Cấp 2GB để lưu trữ database (phù hợp với dung lượng còn lại của máy)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yas-postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        args: ["-c", "max_connections=500"]
        env:
        - name: POSTGRES_USER
          value: user
        - name: POSTGRES_PASSWORD
          value: password
        - name: POSTGRES_DB
          value: postgres 
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/
        # BƯỚC 2: GẮN Ổ CỨNG VÀO THƯ MỤC DỮ LIỆU CỦA POSTGRES
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
      # BƯỚC 3: KHAI BÁO VOLUME DÙNG PVC ĐÃ TẠO
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432