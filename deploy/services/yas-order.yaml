apiVersion: apps/v1
kind: Deployment
metadata:
  name: yas-order
  namespace: default
  annotations:
    # 1. Chỉ định image cần theo dõi
    argocd-image-updater.argoproj.io/image-list: order=longle2112/yas-order
    # 2. Chiến lược: Luôn lấy bản mới nhất dựa trên thời gian build
    argocd-image-updater.argoproj.io/order.update-strategy: latest
    # 3. Cho phép tự động cập nhật tag vào Deployment này
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yas-order
  template:
    metadata:
      labels:
        app: yas-order
    spec:
      containers:
      - name: yas-order
        image: longle2112/yas-order:latest # Đây là giá trị khởi tạo
        env:
          - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
            value: "5"
          - name: SPRING_DATASOURCE_URL
            value: jdbc:postgresql://postgres-service:5432/yas_order
          - name: SPRING_DATASOURCE_USERNAME
            value: user
          - name: SPRING_DATASOURCE_PASSWORD
            value: password
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: yas-order-service
spec:
  type: NodePort
  selector:
    app: yas-order
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30001 # Cổng để bạn truy cập từ IP Master